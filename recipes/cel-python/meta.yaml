{% set name = "cel-python" %}
{% set version = "0.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/cel_python-{{ version }}.tar.gz
  sha256: 75de72a5cf223ec690b236f0cc24da267219e667bd3e7f8f4f20595fcc1c0c0f

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python >=3.8,<4.0
    - poetry-core
    - pip
  run:
    - python >=3.8.0,<4.0.0
    - jmespath >=1.0.1,<2.0.0
    - lark >=0.12.0,<0.13.0
    - python-dateutil >=2.9.0,<3.0.0
    - pyyaml >=6.0.1,<7.0.0
    - types-pyyaml >=6.0.12,<7.0.0
    - types-python-dateutil >=2.9.0,<3.0.0

test:
  imports:
    - celpy
  commands:
    - pip check
  requires:
    - pip

about:
  summary: Pure Python implementation of Google Common Expression Language
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - dbast
